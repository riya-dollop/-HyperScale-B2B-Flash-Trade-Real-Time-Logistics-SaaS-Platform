apiVersion: v1
kind: ConfigMap
metadata:
  name: hyperscale-config
  namespace: hyperscale
data:
  PORT: "5000"
  NODE_ENV: "production"
  CLIENT_URL: "http://frontend-service:80"
  MONGO_URI: "mongodb://mongodb-service:27017/hyperscale_saas"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq-service:5672"
  KAFKA_BROKERS: "kafka-service:9092"
  KAFKA_CLIENT_ID: "hyperscale-k8s-core"
  KAFKA_GROUP_ID: "hyperscale-k8s-analytics"
  AWS_REGION: "ap-south-1"
  AWS_S3_BUCKET_NAME: "hyperscale-saas-media"

